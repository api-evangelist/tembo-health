aid: tembo-health
name: Tembo Health
description: >-
  Tembo Health is a telemedicine practice (founded 2018) that partners with skilled nursing
  facilities and senior living communities to deliver 24/7 virtual specialty and urgent care to
  elderly residents. Its board-certified clinicians provide treat-in-place emergency medicine,
  psychiatry, cardiology, and dementia care, reducing avoidable ER transfers by roughly 75 percent,
  and the company works with senior-care operators and EHR platforms such as PointClickCare. Tembo
  Health is a healthcare services provider and does not currently publish a public developer API,
  SDK, or documentation surface; this profile captures its identity, security posture, and public
  web properties.
